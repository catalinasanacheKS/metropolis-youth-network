<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metropolis Youth Network</title>
  <meta name="description" content="Rețeaua teatrelor de tineret din Europa — un instrument intern de documentare și parteneriat." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet (CDN — cdnjs) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="#/" class="wordmark" aria-label="Metropolis Youth Network — acasă">
        <span class="wordmark-main">Metropolis Youth Network</span>
        <span class="wordmark-sub">rețeaua europeană de teatru tânăr</span>
      </a>

      <nav class="main-nav" id="main-nav" aria-label="Navigare principală">
        <a href="#/" data-route="/">Acasă</a>
        <a href="#/director" data-route="/director">Teatre</a>
        <a href="#/harta" data-route="/harta">Hartă</a>
        <a href="#/tari" data-route="/tari">Pe țări</a>
        <a href="#/resurse" data-route="/resurse">Rețele &amp; resurse</a>
        <a href="#/activitate" data-route="/activitate">Activitate</a>
        <a href="#/despre" data-route="/despre">Despre</a>
      </nav>

      <div class="header-user" id="header-user">
        <!-- filled by JS: shows current user or "Autentifică-te" -->
      </div>

      <button class="nav-toggle" id="nav-toggle" aria-label="Meniu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="app" class="app"><!-- views render here --></main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>Metropolis Youth Network — instrument intern de documentare &amp; parteneriat.</p>
      <p class="muted" id="footer-status">—</p>
    </div>
  </footer>

  <!-- Modal host -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
  </div>

  <!-- Toast host -->
  <div class="toast-host" id="toast-host" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" referrerpolicy="no-referrer"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
